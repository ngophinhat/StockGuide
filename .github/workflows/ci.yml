name: Frontend CI

on:
  push:
    branches:
      - main
      - Header
  pull_request:
    branches:
      - main
      - Header
jobs:
  build:
    name: Build StockGuide Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-guide-frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npx vite build
